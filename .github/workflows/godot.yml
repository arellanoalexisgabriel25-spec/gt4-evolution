name: Godot prototype checks
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          mv Godot_v4.4-stable_linux.x86_64 godot-bin
      - name: Import project and check scripts
        run: ./godot-bin --headless --path godot --editor --quit
      - name: Run economy tests
        run: ./godot-bin --headless --path godot --script res://tests/test_economy.gd
      - name: Run inspection tests
        run: ./godot-bin --headless --path godot --script res://tests/test_inspection.gd
      - name: Test market values and restoration
        run: ./godot-bin --headless --path godot --script res://tests/test_market_restoration.gd
      - name: Test structured career progression
        run: ./godot-bin --headless --path godot --script res://tests/test_career.gd
      - name: Test tuning compatibility and wear
        run: ./godot-bin --headless --path godot --script res://tests/test_tuning.gd
      - name: Test rival profiles and persistence
        run: ./godot-bin --headless --path godot --script res://tests/test_rivals.gd
      - name: Smoke test driving scene
        run: ./godot-bin --headless --path godot res://scenes/driving.tscn --quit-after 5
      - name: Test driving input and session persistence
        run: ./godot-bin --headless --path godot --script res://tests/test_driving.gd
      - name: Load main scene
        run: ./godot-bin --headless --path godot --quit-after 5
