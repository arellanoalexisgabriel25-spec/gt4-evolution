name: Godot prototype checks
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4-stable_linux.x86_64
          mv Godot_v4.4-stable_linux.x86_64 godot
      - name: Import project and check scripts
        run: ./godot --headless --path godot --editor --quit
      - name: Run economy tests
        run: ./godot --headless --path godot --script res://tests/test_economy.gd
      - name: Load main scene
        run: ./godot --headless --path godot --quit-after 5
